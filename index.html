  <!-- 1. BMI -->
  <script type="application/ld+json" id="faq-bmi">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو BMI الطبيعي؟","acceptedAnswer":{"@type":"Answer","text":"BMI الطبيعي للبالغين من 18.5 إلى 24.9. أقل من 18.5 نحافة، 25-29.9 زيادة وزن، 30+ سمنة حسب WHO."}},{"@type":"Question","name":"كيف أحسب BMI؟","acceptedAnswer":{"@type":"Answer","text":"BMI = الوزن (كجم) / (الطول متر × الطول متر). مثال 70 كجم وطول 1.75 = 70/(1.75*1.75)=22.9 طبيعي."}},{"@type":"Question","name":"هل BMI دقيق للرياضيين؟","acceptedAnswer":{"@type":"Answer","text":"لا، BMI لا يفرق عضلات عن دهون. في HealthCalc نحسب معه نسبة الدهون والبروتين والتمارين المناسبة."}},{"@type":"Question","name":"ما هو الوزن المثالي لطولي؟","acceptedAnswer":{"@type":"Answer","text":"الوزن المثالي ≈ 22 × (الطول بالمتر)². طول 1.70 = 63.6 كجم. نحسبه لك مع BMR والسعرات."}},{"@type":"Question","name":"كيف أنزل BMI من 30 إلى 25؟","acceptedAnswer":{"@type":"Answer","text":"عجز 500-750 سعرة يومياً + 150 دقيقة مشي سريع + خطة أكل بالمطبخ اللي تحبه من HealthCalc."}}]}
  </script>

  <!-- 2. BMR -->
  <script type="application/ld+json" id="faq-bmr">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو BMR؟","acceptedAnswer":{"@type":"Answer","text":"BMR هو معدل الحرق الأساسي - السعرات التي يحرقها جسمك في الراحة. نحسبه بمعادلة Mifflin-St Jeor المعتمدة من ACSM."}},{"@type":"Question","name":"ما الفرق بين BMR و TDEE؟","acceptedAnswer":{"@type":"Answer","text":"BMR = حرق الراحة فقط. TDEE = BMR × معامل النشاط (1.2 خامل إلى 1.9 نشاط عالي). TDEE هو سعراتك الفعلية."}},{"@type":"Question","name":"هل العمر يقلل BMR؟","acceptedAnswer":{"@type":"Answer","text":"نعم، BMR يقل 1-2% كل 10 سنوات بعد 20 سنة بسبب فقدان العضلات. الحل تمارين مقاومة + بروتين كافي."}},{"@type":"Question","name":"كيف أزيد BMR؟","acceptedAnswer":{"@type":"Answer","text":"بناء عضلات (كل كجم عضلات يحرق 13 سعرة إضافية)، نوم 7-8 ساعات، شرب ماء كافي، وجبات بروتين موزعة."}},{"@type":"Question","name":"كم BMR الطبيعي؟","acceptedAnswer":{"@type":"Answer","text":"للرجل المتوسط 1600-1800 سعرة، للمرأة 1200-1400 سعرة في الراحة. نحسبه بدقة حسب وزنك وطولك وعمرك وجنسك."}}]}
  </script>

  <!-- 3. Ideal Weight -->
  <script type="application/ld+json" id="faq-ideal-weight">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو الوزن المثالي؟","acceptedAnswer":{"@type":"Answer","text":"الوزن الذي يكون عنده BMI=22 وهو الأكثر صحة وطول عمر حسب دراسات USDA. نحسبه مع نسبة الدهون المثالية."}},{"@type":"Question","name":"هل الوزن المثالي يختلف للرجل والمرأة؟","acceptedAnswer":{"@type":"Answer","text":"نعم، معادلة Devine: للرجل 50+2.3×(الطول بالإنش-60)، للمرأة 45.5+2.3×(الطول بالإنش-60). نستخدمها في HealthCalc."}},{"@type":"Question","name":"وزني المثالي 65 لكن شكلي نحيف؟","acceptedAnswer":{"@type":"Answer","text":"الوزن المثالي رقم، الشكل يعتمد على توزيع دهون وعضلات. لذلك نعطيك خطة تمارين تشكيل الجسم وليس وزن فقط."}},{"@type":"Question","name":"هل أقدر أوصل للمثالي في شهر؟","acceptedAnswer":{"@type":"Answer","text":"النزول الصحي 0.5-1 كجم أسبوعياً. لو الفرق 10 كجم تحتاج 2-3 شهور بخطة أكل متوازنة."}},{"@type":"Question","name":"ما علاقة الوزن المثالي بالطول؟","acceptedAnswer":{"@type":"Answer","text":"كل 5 سم طول تزيد الوزن المثالي حوالي 3-4 كجم. احسب طولك ووزنك الحالي ونقولك كم تحتاج."}}]}
  </script>

  <!-- 4. Calories / TDEE -->
  <script type="application/ld+json" id="faq-calories">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم سعرة أحتاج يومياً لأخس؟","acceptedAnswer":{"@type":"Answer","text":"سعراتك للخسارة = TDEE - 500 سعرة. مثال TDEE 2200 تحتاج 1700 لتخس 0.5 كجم أسبوعياً."}},{"@type":"Question","name":"ما هو TDEE؟","acceptedAnswer":{"@type":"Answer","text":"TDEE إجمالي حرقك اليومي شامل النشاط. نحسبه BMR × معامل النشاط (1.2-1.9) حسب شغلك وتمارينك."}},{"@type":"Question","name":"هل 1200 سعرة قليلة؟","acceptedAnswer":{"@type":"Answer","text":"1200 قليلة لمعظم الناس وتسبب ثبات وزن. الحد الأدنى الآمن 1200 للنساء و1500 للرجال مع متابعة."}},{"@type":"Question","name":"كيف أحسب سعرات أكلي؟","acceptedAnswer":{"@type":"Answer","text":"في قسم الوزن واللياقة عندنا مطابخ كاملة (مصري، هندي، متوسطي) كل طبق فيه سعراته وبروتينه جاهز، تختار وتضيف لخطتك."}},{"@type":"Question","name":"هل الرياضة تزيد سعراتي؟","acceptedAnswer":{"@type":"Answer","text":"نعم، 30 دقيقة مشي سريع تحرق 150-200 سعرة، جري 300، حديد 200. نربطها بساعتك الذكية لحساب دقيق."}}]}
  </script>

  <!-- 5. Blood Pressure -->
  <script type="application/ld+json" id="faq-blood-pressure">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو الضغط الطبيعي؟","acceptedAnswer":{"@type":"Answer","text":"الطبيعي أقل من 120/80 حسب DASH. 120-129/80 مرتفع، 130-139/80-89 مرحلة أولى، 140+/90+ مرحلة ثانية."}},{"@type":"Question","name":"ضغطي 130/85 هل هو خطر؟","acceptedAnswer":{"@type":"Answer","text":"130/85 مرحلة أولى، ليس خطر فوري لكن يحتاج متابعة، تقليل ملح، DASH diet، مشي 30 دقيقة يومياً، وقياس يومي."}},{"@type":"Question","name":"كيف أنزل الضغط بدون دواء؟","acceptedAnswer":{"@type":"Answer","text":"DASH diet (خضار، فواكه، قليل ملح)، 150 دقيقة رياضة أسبوعياً، نوم جيد، تقليل قهوة، وتمارين تنفس. في HealthCalc نعطيك خطة DASH بمطابخ تحبها."}},{"@type":"Question","name":"هل القهوة ترفع الضغط؟","acceptedAnswer":{"@type":"Answer","text":"ترفع مؤقتاً 5-10 درجات لمدة ساعة. لو ضغطك عالي قلل لـ 1-2 فنجان وتابع القياس بعد ساعة."}},{"@type":"Question","name":"متى أذهب للدكتور للضغط؟","acceptedAnswer":{"@type":"Answer","text":"لو ضغطك 180/120 أو أكثر، أو مع صداع شديد، زغللة، ألم صدر، اذهب طوارئ. لو 140/90 متكرر تابع مع دكتور خلال أسبوع."}}]}
  </script>

  <!-- 6. HbA1c / Diabetes -->
  <script type="application/ld+json" id="faq-diabetes">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو السكر التراكمي الطبيعي؟","acceptedAnswer":{"@type":"Answer","text":"الطبيعي أقل من 5.7%، من 5.7-6.4% ما قبل سكري، 6.5% أو أكثر سكري حسب ADA."}},{"@type":"Question","name":"تراكمي 6.5% هل يعني سكري؟","acceptedAnswer":{"@type":"Answer","text":"نعم 6.5% تشخيص سكري حسب ADA، لكن يحتاج تأكيد بتحليل صايم. نعطيك في HealthCalc خطة Low GI وتفسير كامل."}},{"@type":"Question","name":"كيف أنزل التراكمي من 7 إلى 6؟","acceptedAnswer":{"@type":"Answer","text":"تقليل نشويات مكررة، أكل ألياف وبروتين، مشي 30 دقيقة بعد الأكل، نوم منتظم. كل 1% نزول يقلل مضاعفات 35%."}},{"@type":"Question","name":"هل الصيام يؤثر على تحليل HbA1c؟","acceptedAnswer":{"@type":"Answer","text":"لا، HbA1c لا يحتاج صيام لأنه متوسط 3 شهور. تحليل السكر الصايم يحتاج 8 ساعات صيام."}},{"@type":"Question","name":"ما هو الفرق بين سكر صايم وتراكمي؟","acceptedAnswer":{"@type":"Answer","text":"الصايم لحظي اليوم، الطبيعي 70-99. التراكمي متوسط 3 شهور. الاثنين مهمين ونفسرهم لك معاً."}}]}
  </script>

  <!-- 7. Cholesterol -->
  <script type="application/ld+json" id="faq-cholesterol">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو الكوليسترول الطبيعي؟","acceptedAnswer":{"@type":"Answer","text":"الكلي أقل من 200، LDL الضار أقل من 100، HDL النافع أعلى من 60، Triglycerides أقل من 150 حسب USDA."}},{"@type":"Question","name":"LDL 130 هل هو عالي؟","acceptedAnswer":{"@type":"Answer","text":"130 حدودي مرتفع، المثالي أقل من 100 خصوصاً لمرضى سكر أو ضغط. يحتاج تقليل دهون مشبعة وزيادة ألياف."}},{"@type":"Question","name":"كيف أنزل الكوليسترول بدون دواء؟","acceptedAnswer":{"@type":"Answer","text":"شوفان، مكسرات، سمك دهني، زيت زيتون، تقليل مقلي وسمن، 30 دقيقة رياضة. في HealthCalc نرشح أطباق متوسطية مناسبة."}},{"@type":"Question","name":"هل البيض يرفع الكوليسترول؟","acceptedAnswer":{"@type":"Answer","text":"بيضة يومياً آمنة لمعظم الناس، المشكلة في الصفار الكثير مع دهون مشبعة. بياض البيض بروتين ممتاز."}},{"@type":"Question","name":"ما الفرق بين LDL و HDL؟","acceptedAnswer":{"@type":"Answer","text":"LDL ضار يترسب في الشرايين، HDL نافع ينظف الشرايين. نهدف LDL واطي وHDL عالي."}}]}
  </script>

  <!-- 8. Uric Acid / Gout -->
  <script type="application/ld+json" id="faq-uric-acid">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو حمض اليوريك الطبيعي؟","acceptedAnswer":{"@type":"Answer","text":"للرجال 3.4-7.0 mg/dL، للنساء 2.4-6.0 mg/dL. أعلى من 6.8 يبدأ يترسب ويسبب نقرس."}},{"@type":"Question","name":"يوريك 8 هل هو نقرس؟","acceptedAnswer":{"@type":"Answer","text":"8 عالي ويزيد خطر النقرس، لكن التشخيص يحتاج أعراض ألم مفصل إبهام القدم مع تحليل. نقلل بروتين حيواني وماء كثير."}},{"@type":"Question","name":"ما الأكل الممنوع للنقرس؟","acceptedAnswer":{"@type":"Answer","text":"كبدة، جمبري، سردين، لحوم حمراء كثيرة، بيرة، مشروبات سكرية. المسموح خضار، ألبان قليلة دسم، كرز، ماء كثير."}},{"@type":"Question","name":"هل الماء يقلل اليوريك؟","acceptedAnswer":{"@type":"Answer","text":"نعم، 2-3 لتر ماء يومياً يساعد الكلى تطرد اليوريك ويقلل نوبات النقرس 40%."}},{"@type":"Question","name":"كيف أعالج نوبة النقرس؟","acceptedAnswer":{"@type":"Answer","text":"راحة، ثلج، ماء كثير، تجنب اللحوم، ومتابعة دكتور. في HealthCalc نعطيك خطة Low Purine بمطابخ تحبها وتمارين آمنة للمفاصل."}}]}
  </script>

  <!-- 9. IBS / Colon -->
  <script type="application/ld+json" id="faq-ibs">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو القولون العصبي IBS؟","acceptedAnswer":{"@type":"Answer","text":"اضطراب في حركة الأمعاء يسبب ألم بطن، انتفاخ، إسهال أو إمساك. يشخص بالأعراض وليس تحليل، ويتحسن بتنظيم أكل Low FODMAP."}},{"@type":"Question","name":"ما الأكل الممنوع للقولون؟","acceptedAnswer":{"@type":"Answer","text":"بقوليات، كرنب، بصل، ثوم، مقلي، حار، مشروبات غازية، قهوة كثيرة. في HealthCalc نعطيك خطة Low FODMAP بمطابخ تحبها."}},{"@type":"Question","name":"هل القولون يسبب زيادة وزن؟","acceptedAnswer":{"@type":"Answer","text":"القولون نفسه لا يزيد وزن لكن الانتفاخ واحتباس الغازات يعطي شكل بطن كبير. تنظيم الأكل والبروبيوتيك يحسن الشكل."}},{"@type":"Question","name":"كيف أعالج القولون نهائياً؟","acceptedAnswer":{"@type":"Answer","text":"لا يوجد علاج نهائي لكن 70% يتحسنون بـ Low FODMAP + ألياف ذائبة + رياضة خفيفة + نوم منتظم + تقليل توتر."}},{"@type":"Question","name":"هل تحليل البراز يكشف القولون؟","acceptedAnswer":{"@type":"Answer","text":"تحليل البراز ينفي أمراض أخرى، لكن IBS يشخص بالأعراض (ألم 3 أيام شهرياً + تغير براز). نعطيك Symptom Checker في HealthCalc."}}]}
  </script>

  <!-- 10. Liver -->
  <script type="application/ld+json" id="faq-liver">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو ALT و AST الطبيعي؟","acceptedAnswer":{"@type":"Answer","text":"ALT الطبيعي 7-56 U/L، AST 10-40 U/L. ارتفاعهم يعني التهاب كبد دهني أو فيروسي أو أدوية."}},{"@type":"Question","name":"ALT 80 هل هو خطر؟","acceptedAnswer":{"@type":"Answer","text":"80 أعلى من الطبيعي بمرتين، غالباً كبد دهني. يحتاج تقليل دهون، رياضة، وتكرار تحليل بعد شهر مع خطة غذائية قليلة دهون."}},{"@type":"Question","name":"كيف أنظف الكبد؟","acceptedAnswer":{"@type":"Answer","text":"الكبد ينظف نفسه، المطلوب تقليل سكر ودهون، أكل خضار ورقي، شرب ماء، رياضة، وتجنب كحول وأدوية بدون داعي."}},{"@type":"Question","name":"هل الكبد الدهني يسبب زيادة وزن؟","acceptedAnswer":{"@type":"Answer","text":"الكبد الدهني مرتبط بزيادة وزن ودهون بطن، ونزول 7-10% من وزنك يحسن ALT بنسبة 50%."}},{"@type":"Question","name":"ما الأكل المفيد للكبد؟","acceptedAnswer":{"@type":"Answer","text":"قهوة باعتدال، شاي أخضر، سمك، مكسرات، خضار صليبي (بروكلي)، زيت زيتون. في HealthCalc نرشح أطباق متوسطية للكبد."}}]}
  </script>

  <!-- 11. Kidney / CKD -->
  <script type="application/ld+json" id="faq-kidney">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو Creatinine الطبيعي؟","acceptedAnswer":{"@type":"Answer","text":"للرجال 0.7-1.3 mg/dL، للنساء 0.6-1.1 mg/dL. ارتفاعه يعني ضعف وظائف كلى."}},{"@type":"Question","name":"ما هو eGFR الطبيعي؟","acceptedAnswer":{"@type":"Answer","text":"eGFR أعلى من 90 طبيعي، 60-89 بداية ضعف، أقل من 60 ضعف مزمن. نحسبه لك من Creatinine والعمر والجنس."}},{"@type":"Question","name":"كيف أحافظ على الكلى؟","acceptedAnswer":{"@type":"Answer","text":"شرب 2-2.5 لتر ماء، تقليل ملح، تحكم ضغط وسكر، تجنب مسكنات كثيرة، رياضة، ومتابعة Creatinine كل 6 شهور."}},{"@type":"Question","name":"هل البروتين يضر الكلى؟","acceptedAnswer":{"@type":"Answer","text":"بروتين عالي جداً (أكثر من 2جم/كجم) قد يجهد كلى ضعيفة. لمرضى CKD نعطي 0.8 جم/كجم مع خطة قليلة بوتاسيوم."}},{"@type":"Question","name":"ما الأكل الممنوع لمرضى الكلى؟","acceptedAnswer":{"@type":"Answer","text":"موز، برتقال، طماطم، بطاطس، ملح كثير، مشروبات غازية غامقة. نعطيك في HealthCalc خطة Low Potassium بمطابخ تحبها."}}]}
  </script>

  <!-- 12. Thyroid -->
  <script type="application/ld+json" id="faq-thyroid">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو TSH الطبيعي؟","acceptedAnswer":{"@type":"Answer","text":"TSH الطبيعي 0.4-4.0 mIU/L. أعلى من 4 خمول، أقل من 0.4 نشاط. T3 و T4 يكملون التشخيص."}},{"@type":"Question","name":"TSH 6 هل هو خمول؟","acceptedAnswer":{"@type":"Answer","text":"6 خمول بسيط، غالباً يحتاج متابعة وعلاج لو معه أعراض تعب وزيادة وزن وتساقط شعر. نعطيك خطة غنية يود وسيلينيوم."}},{"@type":"Question","name":"هل خمول الغدة يزيد الوزن؟","acceptedAnswer":{"@type":"Answer","text":"نعم يقلل الحرق 10-15% ويسبب زيادة 2-5 كجم ماء ودهون. نزول الوزن يحتاج علاج الغدة أولاً + عجز سعرات بسيط + تمارين مقاومة."}},{"@type":"Question","name":"ما الأكل المفيد للغدة؟","acceptedAnswer":{"@type":"Answer","text":"سمك بحري، بيض، مكسرات برازيلية (سيلينيوم)، ألبان، خضار. تجنب كرنب نيء كثير مع خمول."}},{"@type":"Question","name":"هل نشاط الغدة يخسس؟","acceptedAnswer":{"@type":"Answer","text":"نشاط الغدة يزود حرق ويسبب نزول وزن سريع مع ضربات قلب سريعة. يحتاج علاج فوري وخطة سعرات عالية وبروتين."}}]}
  </script>

  <!-- 13. Workout Routine -->
  <script type="application/ld+json" id="faq-workout">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كم مرة أتمرن في الأسبوع؟","acceptedAnswer":{"@type":"Answer","text":"لخسارة دهون 4-5 مرات (3 كارديو + 2 مقاومة)، للحفاظ 3 مرات، لبناء عضلات 4 مقاومة. في HealthCalc نولد لك جدول حسب هدفك وحالتك."}},{"@type":"Question","name":"هل المشي يكفي للتخسيس؟","acceptedAnswer":{"@type":"Answer","text":"المشي السريع 30 دقيقة يحرق 150-200 سعرة، يكفي مع عجز أكل. لكن المقاومة تحافظ على العضلات وشكل الجسم."}},{"@type":"Question","name":"ما أفضل تمرين لمرضى الضغط؟","acceptedAnswer":{"@type":"Answer","text":"مشي، سباحة، دراجة هوائية 30 دقيقة 5 أيام. تجنب رفع أثقال ثقيل وحبس نفس. نرشح تمارين آمنة DASH."}},{"@type":"Question","name":"هل تمارين البطن تنزل الكرش؟","acceptedAnswer":{"@type":"Answer","text":"تمارين البطن تقوي العضلات لكن لا تحرق دهون البطن وحدها. نزول الكرش يحتاج عجز سعرات + كارديو + تمارين بطن."}},{"@type":"Question","name":"كيف أبدأ رياضة وأنا وزني عالي؟","acceptedAnswer":{"@type":"Answer","text":"ابدأ مشي 10 دقائق + تمارين كرسي + سباحة. في HealthCalc عندنا تمارين Low Impact آمنة للمفاصل حسب وزنك."}}]}
  </script>

  <!-- 14. Lab-to-Plan -->
  <script type="application/ld+json" id="faq-lab-to-plan">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو Lab-to-Plan؟","acceptedAnswer":{"@type":"Answer","text":"نظام في HealthCalc تدخل نتيجة تحليلك (سكر، ضغط، كوليسترول، نقرس...) يفسرها لك فوراً ويولد خطة أكل وتمارين مناسبة لنتيجتك."}},{"@type":"Question","name":"هل التفسير يغني عن الدكتور؟","acceptedAnswer":{"@type":"Answer","text":"لا، التفسير تثقيفي فقط حسب ADA/DASH/USDA. أي نتيجة عالية تحتاج متابعة طبيب. نحن نساعدك تفهم تحليلك وتجهز أسئلة للدكتور."}},{"@type":"Question","name":"ما التحاليل التي تفسرونها؟","acceptedAnswer":{"@type":"Answer","text":"سكر صايم وتراكمي HbA1c، ضغط انقباضي انبساطي، كوليسترول كلي LDL HDL Trig، يوريك أسيد، ALT AST، Creatinine eGFR، TSH T3 T4."}},{"@type":"Question","name":"كيف أدخل نتيجة التحليل؟","acceptedAnswer":{"@type":"Answer","text":"اختر حالتك (سكر، ضغط...)، جاوب هل عملت تحاليل، ادخل الرقم من ورقة التحليل، يظهر تفسير فوري طبيعي/مرتفع مع توصية."}},{"@type":"Question","name":"هل بياناتي آمنة؟","acceptedAnswer":{"@type":"Answer","text":"نعم، كل البيانات في جهازك localStorage فقط، لا نرسلها لسيرفر. تقدر تمسحها أي وقت."}}]}
  </script>

  <!-- 15. Smartwatch -->
  <script type="application/ld+json" id="faq-smartwatch">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"كيف أربط ساعتي بـ HealthCalc؟","acceptedAnswer":{"@type":"Answer","text":"نزل Google Fit أو Apple Health، فعل صلاحيات خطوات ونوم وضربات قلب، واعمل Sync في قسم Smartwatch عندنا."}},{"@type":"Question","name":"ما فائدة ربط الساعة؟","acceptedAnswer":{"@type":"Answer","text":"تحسب سعراتك الفعلية TDEE بدقة، تتابع مشي وجري ونوم وضربات قلب، وتعدل خطتك أوتوماتيك حسب نشاطك."}},{"@type":"Question","name":"هل تدعمون Fitbit و Garmin؟","acceptedAnswer":{"@type":"Answer","text":"نعم، أي ساعة تزامن مع Google Fit أو Apple Health تظهر عندنا: Fitbit, Garmin, Samsung Watch, Mi Band."}},{"@type":"Question","name":"هل الساعة تحسب سعرات الأكل؟","acceptedAnswer":{"@type":"Answer","text":"الساعة تحسب الحرق فقط. سعرات الأكل تحسبها من مطابخنا (مصري، متوسطي...) وتختار أطباقك."}},{"@type":"Question","name":"هل أحتاج ساعة غالية؟","acceptedAnswer":{"@type":"Answer","text":"لا، حتى Mi Band بـ 500 جنيه تكفي خطوات ونوم وضربات قلب. المهم الاستمرارية."}}]}
  </script>

  <!-- 16. Weight & Fitness General -->
  <script type="application/ld+json" id="faq-weight-fitness">
  {"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"ما هو أفضل نظام غذائي للتخسيس؟","acceptedAnswer":{"@type":"Answer","text":"أفضل نظام هو الذي تلتزم به. في HealthCalc نعطيك مطابخ تحبها (مصري، هندي، متوسطي) مع عجز سعرات محسوب، فالالتزام أعلى."}},{"@type":"Question","name":"هل أقدر آكل عيش ورز وأخس؟","acceptedAnswer":{"@type":"Answer","text":"نعم، بكمية محسوبة. رغيف بلدي 150 سعرة، 100جم رز 130 سعرة. الفكرة في الكمية والبروتين معه."}},{"@type":"Question","name":"كم كيلو أنزل في الشهر؟","acceptedAnswer":{"@type":"Answer","text":"الصحي 2-4 كجم شهرياً. نزول سريع يسبب ثبات وترهل. نولد لك خطة 0.5-1 كجم أسبوعياً."}},{"@type":"Question","name":"ما هو المطبخ المناسب لمرضى السكر؟","acceptedAnswer":{"@type":"Answer","text":"المتوسطي والمصري (عدس، فول، سلطة، سمك مشوي) Low GI. نتجنب حلويات ومقليات ونركز ألياف وبروتين."}},{"@type":"Question","name":"هل يوجد ترشيح حسب منطقتي؟","acceptedAnswer":{"@type":"Answer","text":"نعم، لو في مصر نرشح أطباق مصرية ومتوسطية متوفرة حولك، لو في الخليج نرشح أطباق خليجية صحية، وهكذا."}}]}
  </script>
