    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Health Fingerprint",
      "url": "https://healthfingerprint.com/",
      "logo": "https://healthfingerprint.com/apple-touch-icon.png",
      "description": "Free health calculators and personalized care plans for diabetes, hypertension, cholesterol, and more.",
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Health Fingerprint",
      "url": "https://healthfingerprint.com/",
      "description": "Free BMI, BMR, TDEE calculators plus advanced medical care for diabetes, hypertension, cholesterol, and gout.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://healthfingerprint.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script>
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
