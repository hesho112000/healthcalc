<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>جاري التحويل</title>
  <style>
    body{margin:0;background:#FDFBF7;color:#0F4C3A;font-family:'Tajawal',sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;font-weight:800;text-align:center}
  </style>
</head>
<body>
  <div>جاري فتح الصفحة المطلوبة...</div>
  <script>
    sessionStorage.setItem('hc:redirect', location.pathname + location.search + location.hash);
    var dir = location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1);
    location.replace(dir + 'index.html');
  </script>
</body>
</html>
